[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "high-performance-llm-inference-engine"
version = "0.1.0"
description = "High-performance LLM inference engine with continuous batching, KV cache management, speculative decoding, and quantization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
